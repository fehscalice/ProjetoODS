<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="./assets/logoRecicla+Branco.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Recicla+ | Cadastro</title>
</head>

<body class="body_cadastro">
    <main>
        <section class="cadastro">
            <img src="./assets/logoRecicla+Branco.png" alt="Logo Recicla+" class="logoRecicla">
            <form action="./login.html" method="get">
                <input type="text" id="name" name="name" placeholder="Nome completo" required class="campo_form">
                <input type="email" id="email" name="email" placeholder="Email" required class="campo_form">
                <input type="password" id="password" name="password" placeholder="Senha" required class="campo_form">
                <input type="tel" id="phone" name="phone" placeholder="Telefone" required class="campo_form">
                <input type="text" id="local" name="local" placeholder="Cidade" required class="campo_form">
                <input type="submit" value="Cadastrar-se" class="submit">
            </form>
        </section>

        <section class="conectar">
            <p>Tem uma conta?</p> <a id="conectar" href="./login.html">Conecte-se</a>
        </section>
    </main>

    <footer class="footer_cadastro">
        <p>© 2025 Recicla+ | Desenvolvido por Artur Gouvea Bertoluci e Felipe Nunino Scalice</p>
    </footer>
</body>

</html>
