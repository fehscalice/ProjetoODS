<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciando em Programação | Cadastro</title>
</head>
<body>
    <form action="./login.html" method="get">
        <input type="text" id="name" name="name" placeholder="Nome completo" required><br>
        <input type="email" id="email" name="email" placeholder="Email" required><br>
        <input type="password" id="password" name="password" placeholder="Senha" required><br>
        <input type="number" id="phone" name="phone" placeholder="Telefone" required><br>
        <select id="interest" name="interest">
            <option value="" selected disabled hidden>Área de interesse</option>
            <option value="none"></option>
            <option value="front-end"">Front-end</option>
            <option value="back-end">Back-end</option>
            <option value="data-science">Data Science</option>
            <option value="devops">DevOps</option>
        </select><br>
        <br>
        <input type="submit" value="Cadastrar-se"><br>
    </form>
</body>
</html>
