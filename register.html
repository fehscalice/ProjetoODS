<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reciclagem e Saneamento | Cadastro</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="pag_cadastro">
    <form action="./login.html" method="get">
        <input type="text" id="name" name="name" placeholder="Nome completo" required class="campo_form">
        <input type="email" id="email" name="email" placeholder="Email" required class="campo_form">
        <input type="password" id="password" name="password" placeholder="Senha" required class="campo_form">
        <input type="number" id="phone" name="phone" placeholder="Telefone" required class="campo_form">
        <input type="text" id="local" name="local" placeholder="Localização" required class="campo_form">
        <input type="submit" value="Cadastrar-se" class="submit">
    </form>
</body>
</html>
