<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="./assets/logoRecicla+Branco.png" />
  <title>Recicla+ | Admin</title>
</head>

<body class="body_index">

  <header class="header_index">
    <img src="./assets/logoRecicla+Branco.png" alt="Logo Recicla+ Branco" />
    <nav>
      <a href="principal.html">Início</a>
      <a href="principal.html#reciclagem">Reciclagem</a>
      <a href="principal.html#coleta">Coleta</a>
      <a href="principal.html#guia">Guia</a>
      <a href="principal.html#ods">ODS</a>
      <a href="admin.html" style="text-decoration:underline;font-weight:700">Admin</a>
    </nav>
  </header>

  <main class="main_index">

    <section class="admin_container">

      <h2>Admin - Cadastrar Usuários</h2>

      <form id="userForm">

        <div class="admin_inputs">
          <input type="text" id="userName" placeholder="Nome do usuário" required class="campo_form" />
          <input type="email" id="userEmail" placeholder="E-mail" required class="campo_form" />
        </div>

        <div class="admin_buttons">
          <button type="submit" id="btnCadastrar" class="btn_admin">Cadastrar</button>
          <button type="button" id="btnLimpar" class="btn_admin_dark">Limpar</button>
        </div>

      </form>

      <div class="admin_tools">
        <input type="text" id="searchInput" placeholder="Pesquisar por nome ou e-mail" class="campo_form" />
        <button id="btnExcluirTodos" class="btn_admin">Excluir todos</button>
      </div>

      <h3>Lista de cadastros</h3>

      <ul id="userList"></ul>

    </section>

  </main>

  <footer class="footer_index">
    <p>© 2025 Recicla+ | Desenvolvido por Artur Gouvea Bertoluci e Felipe Nunino Scalice</p>
  </footer>

  <script src="admin.js"></script>

</body>
</html>
